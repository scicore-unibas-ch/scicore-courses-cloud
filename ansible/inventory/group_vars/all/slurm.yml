---

# Slurm is installed and configured by the pescobar.slurm collection
# (slurm_install role): Ubuntu 26.04 packages, static config. The group
# names are the tags the OpenTofu code puts on the VMs.
slurm_install_controller_group: slurm_master
slurm_install_workers_group: slurm_workers
slurm_install_submit_group: slurm_submit_hosts
slurm_install_manage_etc_hosts: true

slurm_install_cluster_name: slurm-cluster

# settings for the slurm accounting daemon
# TODO: move to ansible-vault
slurm_install_dbd_storage_password: aadAD432saAdfaoiu

# the course users (user01, user02...) are added to the slurm accounting db
# on their first job submission
slurm_install_job_submit_lua_template: job_submit_autoadd.lua.j2

# cloud VMs can be slow to answer
slurm_install_slurm_conf_extra: |
  MessageTimeout=60
  UnkillableStepTimeout=180
