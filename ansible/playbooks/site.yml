---

- name: Upgrade the packages and reboot if needed
  import_playbook: apt-dist-upgrade.yml
- name: Configure the course cluster and Slurm
  import_playbook: configure.yml
- name: Limit the memory per user in the login node
  import_playbook: memory_limit_login_node.yml
- name: Warm the cvmfs cache
  import_playbook: cvmfs-presync.yml
- name: Install R and RStudio server
  import_playbook: rstudio.yml
- name: Install Open OnDemand
  import_playbook: ondemand.yml
