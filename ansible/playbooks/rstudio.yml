---

- name: Deploy R lang and Rstudio using apt repos
  hosts: login_node
  gather_facts: true
  become: true

  tasks:

    # https://cloud.r-project.org/bin/linux/ubuntu/
    - name: Add the CRAN apt repo for the latest R lang
      block:

        - name: Install python3-debian (required by deb822_repository)
          ansible.builtin.apt:
            name: python3-debian
            cache_valid_time: 600

        - name: Add the apt repo for latest r-lang
          ansible.builtin.deb822_repository:
            name: r-lang
            uris: https://cloud.r-project.org/bin/linux/ubuntu
            # a suite ending in '/' is a flat path, so no components
            suites: "{{ ansible_facts['distribution_release'] }}-cran40/"
            architectures: amd64
            signed_by: https://cloud.r-project.org/bin/linux/ubuntu/marutter_pubkey.asc
          register: _r_lang_repo

    - name: Install CRAN and bioconductor packages as debs
      block:

        - name: Add the apt repo r2u
          ansible.builtin.deb822_repository:
            name: r2u
            uris: https://r2u.stat.illinois.edu/ubuntu
            suites: "{{ ansible_facts['distribution_release'] }}"
            components: main
            architectures: amd64
            signed_by: https://eddelbuettel.github.io/r2u/assets/dirk_eddelbuettel_key.asc
          register: _r2u_repo

        - name: Configure priority for the r2u apt repo
          ansible.builtin.copy:
            dest: /etc/apt/preferences.d/99cranapt
            owner: root
            group: root
            mode: "0644"
            backup: yes
            content: |
              # ansible managed
              Package: *
              Pin: release o=CRAN-Apt Project
              Pin: release l=CRAN-Apt Packages
              Pin-Priority: 700

        # after the r2u repo and pin: otherwise r-base pulls its recommended
        # r-cran-* packages from CRAN, and the next dist-upgrade swaps them for
        # the pinned r2u builds
        # deb822_repository does not refresh the apt cache itself
        - name: Install R lang
          ansible.builtin.apt:
            name: r-base
            update_cache: "{{ _r_lang_repo is changed or _r2u_repo is changed }}"

        - name: Install R CRAN packages
          ansible.builtin.apt:
            name: "{{ local_r_cran_packages | map('regex_replace', '^', 'r-cran-') | list }}"

        - name: Install R bioconductor packages
          ansible.builtin.apt:
            name: "{{ local_r_bioconductor_packages | map('regex_replace', '^', 'r-bioc-') | list }}"

    - name: Install RStudio server
      ansible.builtin.apt:
        deb: "{{ local_rstudio_server_package }}"

    - name: Install extra deps in case some R packages are built from sources
      ansible.builtin.apt:
        name:
          - build-essential
          - pandoc
          - libgraphviz-dev
          - libcurl4-openssl-dev
          - libmagick++-dev
          - libblas-dev
          - liblapack-dev
          - gfortran
          - libgfortran-13-dev
        cache_valid_time: 600

