---

- name: Configure course environment
  hosts: course
  gather_facts: true
  become: true

  handlers:

    - name: Restart systemd-resolved
      ansible.builtin.systemd_service:
        name: systemd-resolved
        state: restarted

  tasks:

    # A compute node deleted and re-created keeps its name but gets a new IP.
    # systemd-resolved would serve the old address from its cache for up to
    # the record's TTL (1 h on this cloud), so turn the cache off.
    - name: Create the systemd-resolved drop-in directory
      ansible.builtin.file:
        path: /etc/systemd/resolved.conf.d
        state: directory
        owner: root
        group: root
        mode: '0755'
      tags: dns

    - name: Do not cache DNS answers (compute node IPs change)
      ansible.builtin.copy:
        content: |
          # Ansible managed
          [Resolve]
          Cache=no
        dest: /etc/systemd/resolved.conf.d/10-no-cache.conf
        owner: root
        group: root
        mode: '0644'
      notify: Restart systemd-resolved
      tags: dns

    - name: Configure timesyncd time
      ansible.builtin.import_role:
        name: wf72.systemd_timesyncd
      tags: timesyncd

    - name: Install some basic packages defined in variable "local_common_packages_to_install"
      ansible.builtin.apt:
        name: "{{ local_common_packages_to_install }}"
        cache_valid_time: 600
      when:
        - local_common_packages_to_install is defined
        - local_common_packages_to_install | length > 0
      tags: common_packages

    - name: Format and mount local disks if defined
      ansible.builtin.import_role:
        name: aeriscloud.disk
      when: disk_additional_disks | length > 0
      tags: local_mounts

    - name: Configure nfs exports if machine is in group nfs_server
      ansible.builtin.import_role:
        name: mrlesmithjr.nfs-server
      when: "'nfs_server' in group_names"
      tags: nfs_server

    - name: Flush handlers so NFS server is restarted
      ansible.builtin.meta: flush_handlers

    - name: Mount NFS shares if defined
      ansible.builtin.import_role:
        name: ome.nfs_mount
      when: nfs_share_mounts | length > 0
      tags: nfs_mounts

    - name: Create local accounts if defined
      ansible.builtin.import_role:
        name: robertdebock.users
      when:
        - users is defined
        - users | length > 0
      tags: users

    - name: Install the cvmfs client if machine is in the cvmfs_client group
      ansible.builtin.import_role:
        name: pescobar.cvmfs_client
      when: "'cvmfs_clients' in group_names"
      tags: cvmfs_clients

    - name: Configure sshd if sshd_config is defined
      ansible.builtin.import_role:
        name: willshersystems.sshd
      when:
        - sshd_config is defined
        - sshd_config | length > 0
      tags: sshd

    - name: Configure users accounts in the cluster
      tags: user_accounts
      block:

        # Also created by tasks/course_users.yml below, but the NFS server
        # task right after this one already needs the group to exist.
        - name: Create a default group "users" for every user
          ansible.builtin.group:
            name: "users"
            gid: 2000
            state: present

        # We do this in the NFS server to make sure that root can access the home folders (just in case root squash is enabled)
        - name: Create the user accounts (starting with uid 2001) | First in the NFS server to create home folders
          when: "'nfs_server' in group_names"
          ansible.builtin.user:
            name: "user{{ item }}"
            uid: "20{{ item }}"
            group: "users"
            home: "{{ local_nfs_mount_point }}/home/user{{ item }}"
            create_home: yes
            shell: /bin/bash
            #update_password: always
            password: "{{ local_users_accounts_password }}"
            generate_ssh_key: yes
            ssh_key_comment: "user{{ item }}_slurm_cluster@ansible-generated"
            state: present
            ssh_key_file: .ssh/id_ed25519
            ssh_key_type: ed25519
          loop: "{{ query('sequence', 'count=' ~ local_users_accounts ~ ' format=%02u') }}"

        # Same file as the compute-node image uses, so the accounts on a
        # dynamically created node match the rest of the cluster.
        - name: Create the user accounts (starting with uid 2001) | Now in every machine
          ansible.builtin.include_tasks: ../tasks/course_users.yml

        # We do this in the NFS server to make sure that root can access the home folders (just in case root squash is enabled)
        - name: Get the ssh public keys for every user
          when: "'nfs_server' in group_names"
          ansible.builtin.slurp:
            src: "{{ local_nfs_mount_point }}/home/user{{ item }}/.ssh/id_ed25519.pub"
          register: _all_users_ssh_public_keys
          loop: "{{ query('sequence', 'count=' ~ local_users_accounts ~ ' format=%02u') }}"

        # We do this in the NFS server to make sure that root can access the home folders (just in case root squash is enabled)
        - name: Add the user ssh keys to their accounts
          when: "'nfs_server' in group_names"
          ansible.posix.authorized_key:
            user: "user{{ item.item }}"
            key: "{{ item.content | b64decode }}"
          loop: "{{ _all_users_ssh_public_keys.results }}"

        # We do this in the NFS server to make sure that root can access the home folders (just in case root squash is enabled)
        - name: Deploy custom ssh config for each user
          when: "'nfs_server' in group_names"
          ansible.builtin.blockinfile:
            path: "{{ local_nfs_mount_point }}/home/user{{ item }}/.ssh/config"
            create: yes
            backup: yes
            owner: "user{{ item }}"
            mode: '0600'
            marker: "# {mark} ANSIBLE MANAGED SSH CONFIG"
            block: |
              Host *
                  StrictHostKeyChecking no
                  ServerAliveInterval 10
          loop: "{{ query('sequence', 'count=' ~ local_users_accounts ~ ' format=%02u') }}"

        - name: Add the teacher's ssh public keys to the ubuntu account in every machine
          ansible.posix.authorized_key:
            user: ubuntu
            key: "{{ item }}"
          loop: "{{ local_teachers_ssh_keys }}"
          tags: ssh_keys_teachers

        - name: Create a private ssh key for user ubuntu in login node
          become: true
          become_user: ubuntu
          ansible.builtin.openssh_keypair:
            path: ~ubuntu/.ssh/id_ed25519
            type: ed25519
            comment: "ubuntu@{{ inventory_hostname }}"
            mode: '0600'

        - name: Fetch the ubuntu user public ssh key from login node to ansible control host
          ansible.builtin.fetch:
            src: ~ubuntu/.ssh/id_ed25519.pub
            dest: ~/.ansible/tmp/id_ed25519_ubuntu_login_node.pub
            flat: yes
          when: "'login_node' in group_names"

        - name: Add the public key for user ubuntu to every machine
          ansible.builtin.authorized_key:
            user: ubuntu
            key: "{{ lookup('file', '~/.ansible/tmp/id_ed25519_ubuntu_login_node.pub') }}"

# A separate play on the slurm hosts, not import_role + when inside the play
# above. The role reads the munge key from the controller in a run_once task
# (tasks/munge.yml in pescobar.slurm.slurm_install) and hands it to every node.
# import_role copies its 'when' onto every task, and for a run_once task
# Ansible evaluates 'when' only for the first host of the play: if that host
# is not in 'slurm' (e.g. nfs-server), the key read is skipped for all hosts
# and "Deploy the cluster munge key" fails. The host order comes from the
# OpenStack inventory, so it would work or break depending on VM names.
# With hosts: slurm every host passes, whichever comes first.
- name: Install and configure slurm
  hosts: slurm
  gather_facts: true
  become: true
  tags: slurm

  roles:
    - pescobar.slurm.slurm_install

