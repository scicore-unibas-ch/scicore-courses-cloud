---
# One command for a whole deployment, after `tofu apply`:
#
#   cd ansible/
#   ansible-playbook playbooks/deploy.yml
#
# 1. site.yml configures the three permanent machines (login node, NFS
#    server, slurm master), Slurm included.
# 2. build-compute-image.yml builds the image the elastic compute nodes boot
#    from - but only if it does not exist yet
#    (compute_image_when_exists: skip, in group_vars/all/compute_image.yml),
#    so running this playbook again costs nothing extra.
#
# The image name is stable (slurm_install_cloud_image), so slurm.conf points
# at it from the first run: the nodes are created on demand and the image is
# in place before any job asks for one.
#
# To rebuild the image after changing what a compute node contains:
#
#   ansible-playbook playbooks/build-compute-image.yml \
#     -e compute_image_when_exists=replace

- name: Configure the cluster
  ansible.builtin.import_playbook: site.yml

- name: Build the compute node image if it is missing
  ansible.builtin.import_playbook: build-compute-image.yml
