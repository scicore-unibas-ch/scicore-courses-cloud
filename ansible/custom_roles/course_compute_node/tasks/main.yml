---
# Everything a course compute node needs besides Slurm itself, applied to the
# VM that becomes the compute-node image. The Slurm side (slurmd, munge key,
# configless) comes from pescobar.slurm.slurm_compute_image, and the image is
# built by playbooks/build-compute-image.yml.
#
# These are the same roles and tasks configure.yml applies to the permanent
# hosts, so a dynamically created node matches the rest of the cluster.

# The image ships whatever the base image has, so upgrade it here: a node
# created on demand has no time to patch itself before it runs jobs. The
# first-boot dpkg lock is already waited out by the builder play in
# pescobar.slurm.build_compute_image.
- name: Perform a dist-upgrade
  ansible.builtin.apt:
    upgrade: dist
    update_cache: true

- name: Configure timesyncd time
  ansible.builtin.include_role:
    name: wf72.systemd_timesyncd

- name: Install the basic packages
  ansible.builtin.apt:
    name: "{{ local_common_packages_to_install }}"
    cache_valid_time: 600
  when:
    - local_common_packages_to_install is defined
    - local_common_packages_to_install | length > 0

- name: Mount the NFS shares
  ansible.builtin.include_role:
    name: ome.nfs_mount
  when: nfs_share_mounts | length > 0

# role_path, not playbook_dir: the build playbook lives in the collection.
- name: Create the course user accounts
  ansible.builtin.include_tasks: "{{ role_path }}/../../tasks/course_users.yml"

- name: Install the cvmfs client
  ansible.builtin.include_role:
    name: pescobar.cvmfs_client

- name: Configure sshd
  ansible.builtin.include_role:
    name: willshersystems.sshd
  when:
    - sshd_config is defined
    - sshd_config | length > 0

- name: Add the teacher's ssh public keys to the ubuntu account
  ansible.posix.authorized_key:
    user: ubuntu
    key: "{{ item }}"
  loop: "{{ local_teachers_ssh_keys }}"

# cvmfs_config setup is a handler in pescobar.cvmfs_client and the build
# playbook flushes handlers only after every site role, i.e. after the
# presync below: without this the autofs map is not installed yet and
# /cvmfs is empty.
- name: Apply the pending cvmfs configuration
  ansible.builtin.meta: flush_handlers

# Warm the cvmfs cache into the image: an elastic node is created on demand
# and would otherwise pay the first fetch during a job. The cleanup in
# pescobar.slurm.slurm_compute_image leaves /var/lib/cvmfs alone, so the
# cache survives into the snapshot. Same stacks as playbooks/cvmfs-presync.yml.
- name: Presync the cvmfs cache
  ansible.builtin.shell: |
    source {{ item }}
    module spider &> /dev/null
    module av &> /dev/null
  args:
    executable: /bin/bash
  loop:
    - /cvmfs/software.eessi.io/versions/{{ cvmfs_client_eessi_version }}/init/bash
    - /cvmfs/soft.computecanada.ca/config/profile/bash.sh
  changed_when: false  # only warms the cvmfs cache, changes nothing
